<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="A four-step loop. One, somebody works something out. Two, it gets picked up from the tools they already work in, without anyone writing a memo. Three, it gets judged before it lands: is it new, is it right, is it worth keeping, and most candidates are not. Four, the next person who starts something similar gets it served before they need it, rather than after they repeated the mistake. The loop then runs again, and the company knows a little more than it did." style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect x="0" y="0" width="960" height="380" rx="16" fill="#FCF8F3"/><title>How a company gets smarter, one lesson at a time</title><g><rect x="40" y="40" width="208" height="166" rx="14" fill="#ECECF4"></rect><text x="60" y="76" font-size="15" font-weight="700" fill="#D5693A">01</text><text x="60" y="106" font-size="16" font-weight="700" fill="#000075">Someone works</text><text x="60" y="127" font-size="16" font-weight="700" fill="#000075">something out</text><text x="60" y="166" font-size="12.5" fill="#3d3d6b">A trap in a migration, a</text><text x="60" y="185" font-size="12.5" fill="#3d3d6b">client&#x27;s real constraint.</text><path d="M 250 123 L 262 123" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 257 118 L 262 123 L 257 128" stroke="#7373AA" stroke-width="1.5" fill="none"></path></g><g><rect x="264" y="40" width="208" height="166" rx="14" fill="#ECECF4"></rect><text x="284" y="76" font-size="15" font-weight="700" fill="#D5693A">02</text><text x="284" y="106" font-size="16" font-weight="700" fill="#000075">It gets picked up</text><text x="284" y="127" font-size="16" font-weight="700" fill="#000075">where they work</text><text x="284" y="166" font-size="12.5" fill="#3d3d6b">From the tools they already</text><text x="284" y="185" font-size="12.5" fill="#3d3d6b">use. Nobody writes a memo.</text><path d="M 474 123 L 486 123" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 481 118 L 486 123 L 481 128" stroke="#7373AA" stroke-width="1.5" fill="none"></path></g><g><rect x="488" y="40" width="208" height="166" rx="14" fill="#ECECF4"></rect><text x="508" y="76" font-size="15" font-weight="700" fill="#D5693A">03</text><text x="508" y="106" font-size="16" font-weight="700" fill="#000075">It gets judged</text><text x="508" y="127" font-size="16" font-weight="700" fill="#000075">before it lands</text><text x="508" y="166" font-size="12.5" fill="#3d3d6b">Is it new, is it right, is it</text><text x="508" y="185" font-size="12.5" fill="#3d3d6b">worth keeping. Most is not.</text><path d="M 698 123 L 710 123" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 705 118 L 710 123 L 705 128" stroke="#7373AA" stroke-width="1.5" fill="none"></path></g><g><rect x="712" y="40" width="208" height="166" rx="14" fill="#ECECF4"></rect><text x="732" y="76" font-size="15" font-weight="700" fill="#D5693A">04</text><text x="732" y="106" font-size="16" font-weight="700" fill="#000075">The next person</text><text x="732" y="127" font-size="16" font-weight="700" fill="#000075">gets it served</text><text x="732" y="166" font-size="12.5" fill="#3d3d6b">Before they need it, not</text><text x="732" y="185" font-size="12.5" fill="#3d3d6b">after they repeated it.</text></g><path d="M 872 206 C 872 262, 872 274, 800 274 L 216 274 C 144 274, 144 262, 144 206" stroke="#7373AA" stroke-width="1.5" fill="none" stroke-dasharray="6 5"></path><path d="M 139 213 L 144 206 L 149 213" stroke="#7373AA" stroke-width="1.5" fill="none"></path><rect x="352" y="258" width="256" height="32" rx="16" fill="#ffffff"></rect><text x="480" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#000075">and the company knows more</text><rect x="40" y="324" width="880" height="1" fill="#C6C6DC"></rect><text x="40" y="356" font-size="14" font-weight="400" fill="#3d3d6b">A knowledge base answers what you already wrote down. This is the part that gets better because people used it.</text></svg>