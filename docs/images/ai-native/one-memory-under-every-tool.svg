<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Three bands. On top, the AI tools people open: Claude, ChatGPT, coding assistants and our own AI Assistant, all connected over the open MCP protocol. In the middle, the Plainsight Brain, holding lessons that compound, the decisions and standards a company has agreed, and the guardrails on access and audit. Underneath, the sources it reaches: our knowledge bases with cited permission-aware documents, our brand kit, and our other systems. The knowledge base is something the Brain plugs into, not what it is." style="font-family:Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect x="0" y="0" width="960" height="560" rx="16" fill="#FCF8F3"/><title>One brain under every tool</title><text x="40" y="20" font-size="12.5" font-weight="700" letter-spacing="2" fill="#000075">WHAT OUR PEOPLE OPEN</text><g><rect x="40" y="36" width="150" height="48" rx="24" fill="#ffffff" stroke="#000075" stroke-width="1.5"></rect><text x="115" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#000075">Claude</text></g><g><rect x="226" y="36" width="160" height="48" rx="24" fill="#ffffff" stroke="#000075" stroke-width="1.5"></rect><text x="306" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#000075">ChatGPT</text></g><g><rect x="422" y="36" width="210" height="48" rx="24" fill="#ffffff" stroke="#000075" stroke-width="1.5"></rect><text x="527" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#000075">Coding assistants</text></g><title>See how our AI Assistant works</title><rect x="668" y="36" width="250" height="48" rx="24" fill="#000075" stroke="#000075" stroke-width="1.5"></rect><text x="793" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#FCF8F3">Our AI Assistant</text><path d="M 115 88 C 115 142, 300 152, 300 198" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 306 88 C 306 142, 420 152, 420 198" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 527 88 C 527 142, 540 152, 540 198" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 793 88 C 793 142, 660 152, 660 198" stroke="#7373AA" stroke-width="1.5" fill="none"></path><rect x="444" y="130" width="72" height="26" rx="13" fill="#ECECF4"></rect><text x="480" y="148" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#000075">MCP</text><rect x="40" y="202" width="880" height="196" rx="16" fill="#ffffff" stroke="#000075" stroke-width="2"></rect><text x="64" y="242" font-size="13" font-weight="700" letter-spacing="3" fill="#000075">THE PLAINSIGHT BRAIN</text><rect x="64" y="252" width="54" height="3" rx="1.5" fill="#D5693A"></rect><g><rect x="64" y="270" width="264" height="110" rx="12" fill="#ECECF4"></rect><text x="84" y="300" font-size="16.5" font-weight="700" fill="#000075">Lessons that</text><text x="84" y="321" font-size="16.5" font-weight="700" fill="#000075">compound</text><text x="84" y="344" font-size="13" fill="#3d3d6b">What one person works out,</text><text x="84" y="364" font-size="13" fill="#3d3d6b">the next one gets served.</text></g><g><rect x="348" y="270" width="264" height="110" rx="12" fill="#ECECF4"></rect><text x="368" y="300" font-size="16.5" font-weight="700" fill="#000075">Decisions and</text><text x="368" y="321" font-size="16.5" font-weight="700" fill="#000075">standards</text><text x="368" y="344" font-size="13" fill="#3d3d6b">How work happens here,</text><text x="368" y="364" font-size="13" fill="#3d3d6b">agreed once, not re-argued.</text></g><g><rect x="632" y="270" width="264" height="110" rx="12" fill="#ECECF4"></rect><text x="652" y="300" font-size="16.5" font-weight="700" fill="#000075">Guardrails</text><text x="652" y="344" font-size="13" fill="#3d3d6b">Access, rules and audit,</text><text x="652" y="364" font-size="13" fill="#3d3d6b">brokered in one place.</text></g><text x="40" y="432" font-size="12.5" font-weight="700" letter-spacing="2" fill="#000075">WHAT IT PLUGS INTO</text><path d="M 480 398 C 480 428, 196 428, 196 456" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 480 398 C 480 428, 480 428, 480 456" stroke="#7373AA" stroke-width="1.5" fill="none"></path><path d="M 480 398 C 480 428, 764 428, 764 456" stroke="#7373AA" stroke-width="1.5" fill="none"></path><title>See how the knowledge engine works</title><rect x="64" y="456" width="264" height="72" rx="14" fill="#ffffff" stroke="#000075" stroke-width="2"></rect><text x="84" y="484" font-size="16" font-weight="700" fill="#000075">Our knowledge bases</text><text x="84" y="506" font-size="13" fill="#3d3d6b">Documents, cited and permission-aware.</text><g><rect x="348" y="456" width="264" height="72" rx="14" fill="#ffffff" stroke="#C6C6DC" stroke-width="1.5"></rect><text x="368" y="484" font-size="16" font-weight="700" fill="#000075">Our brand kit</text><text x="368" y="506" font-size="13" fill="#3d3d6b">One master, every output checked.</text></g><g><rect x="632" y="456" width="264" height="72" rx="14" fill="#ffffff" stroke="#C6C6DC" stroke-width="1.5"></rect><text x="652" y="484" font-size="16" font-weight="700" fill="#000075">Our other systems</text><text x="652" y="506" font-size="13" fill="#3d3d6b">Reached through brokered access.</text></g></svg>