name: Deploy MkDocs to Azure Static Web Apps

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  check_links:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Check Links
    steps:
      - uses: actions/checkout@v4

      - name: Check for em-dashes
        run: |
          if grep -rIn --exclude-dir=.git $'\u2014' .; then
            echo "::error::Em-dash (U+2014) found in the files listed above. This repo bans em-dashes; use a comma, colon, parentheses, or hyphen instead (see AGENTS.md)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir site
            --exclude-path 'site/llms-full\.txt'
            --exclude '^https://plainsightis\.sharepoint\.com/.*'
            --exclude '^https://support\.plainsight\.pro/?$'
            --exclude '^https://playbook\.plainsight\.pro(/.*)?$'
            --exclude '^https://(www\.)?plainsight\.pro/?$'
            --exclude '^https://(www\.)?rva\.be/'
            --exclude '^https://.*\.fgov\.be/'
            --exclude '^https://mobiliteitsbudget\.be/'
            --exclude '^https://marketplace\.microsoft\.com/'
            --exclude '^https://powerbi\.microsoft\.com/'
            --exclude '^https://mobilevikings\.be/'
            --exclude '^https://selfservice\.officient\.io/'
            --exclude '^https://(www\.)?google\.com/maps/'
            site/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy:
    # main deploys to production. A pull request from a branch in this repo deploys to its own
    # staging URL, which the action posts as a comment on the PR; close_pull_request removes it.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "site"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR staging environment
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
